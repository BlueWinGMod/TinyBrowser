apply plugin: 'com.android.application'

android {
    namespace 'com.tiny.browser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tiny.browser'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {}
